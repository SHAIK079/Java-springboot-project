name: Backend - Build, Push to ECR & Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 937492564736.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: img
  CONTAINER_NAME: backend
  CONTAINER_PORT: 8084

jobs:
  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Configure AWS Credentials
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================
      # 3. Verify AWS Identity
      # ==========================================

      - name: Verify AWS Credentials
        run: |
          aws sts get-caller-identity


      # ==========================================
      # 4. Login to Amazon ECR
      # ==========================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 5. Build Backend Docker Image
      # ==========================================

      - name: Build Backend Docker Image
        working-directory: backend
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .


      # ==========================================
      # 6. Push Backend Image to ECR
      # ==========================================

      - name: Push Backend Image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


      # ==========================================
      # 7. Deploy Backend to Backend EC2
      # ==========================================

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.BACKEND_EC2_KEY }}

          script: |
            set -e

            echo "=========================================="
            echo "Starting Backend Deployment"
            echo "=========================================="

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region us-east-1 \
              | docker login \
              --username AWS \
              --password-stdin \
              937492564736.dkr.ecr.us-east-1.amazonaws.com


            echo "=========================================="
            echo "Pulling Backend Image"
            echo "=========================================="

            docker pull \
              937492564736.dkr.ecr.us-east-1.amazonaws.com/img:${{ github.sha }}


            echo "=========================================="
            echo "Stopping Old Backend Container"
            echo "=========================================="

            docker stop backend || true
            docker rm backend || true


            echo "=========================================="
            echo "Starting Backend Container"
            echo "=========================================="

            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8084:8084 \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://${{ secrets.DB_HOST }}:3306/datastore?createDatabaseIfNotExist=true" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
              937492564736.dkr.ecr.us-east-1.amazonaws.com/img:${{ github.sha }}


            echo "=========================================="
            echo "Backend Container Started"
            echo "=========================================="

            docker ps


      # ==========================================
      # 8. Wait for Spring Boot Startup
      # ==========================================

      - name: Wait for Backend Startup
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.BACKEND_EC2_KEY }}

          script: |
            echo "Waiting for Spring Boot application..."
            sleep 20


      # ==========================================
      # 9. Check Docker Container
      # ==========================================

      - name: Check Backend Container
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.BACKEND_EC2_KEY }}

          script: |
            echo "=========================================="
            echo "Docker Container Status"
            echo "=========================================="

            docker ps

            echo "=========================================="
            echo "Backend Container Logs"
            echo "=========================================="

            docker logs backend --tail 50


      # ==========================================
      # 10. Backend Health Check
      # ==========================================

      - name: Backend Health Check
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.BACKEND_EC2_KEY }}

          script: |
            set -e

            echo "Checking Spring Boot health..."

            curl -f http://localhost:8084/actuator/health

            echo ""
            echo "=========================================="
            echo "Backend Deployment Successful!"
            echo "=========================================="


      # ==========================================
      # 11. Deployment Report
      # ==========================================

      - name: Send Deployment Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Backend Deployment Report - ${{ github.repository }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Backend Deployment Report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Actor: ${{ github.actor }}
            Workflow: ${{ github.workflow }}

            ECR Repository:
            937492564736.dkr.ecr.us-east-1.amazonaws.com/img

            Image Tag:
            ${{ github.sha }}

            Backend EC2:
            ${{ secrets.BACKEND_EC2_HOST }}

            Container:
            backend

            Port:
            8084


