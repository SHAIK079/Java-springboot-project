name: Frontend CI/CD - Docker ECR SSH

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "937492564736"

  ECR_REPOSITORY: frontend

  BASTION_USER: ec2-user
  PRIVATE_EC2_USER: ec2-user

  CONTAINER_NAME: frontend-container
  CONTAINER_PORT: 80

  # Unique tag for every workflow run
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}

jobs:

  build-deploy-frontend:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Frontend Source
      # --------------------------------------------------
      - name: Checkout Frontend Source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Configure AWS Credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Verify AWS Identity
      # --------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------
      # 4. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 5. Build Frontend Docker Image
      # --------------------------------------------------
      - name: Build Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "Building frontend image..."

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./frontend

          echo "Frontend image built successfully."


      # --------------------------------------------------
      # 6. Push Frontend Image to ECR
      # --------------------------------------------------
      - name: Push Frontend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "Pushing frontend image to ECR..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Frontend image pushed successfully."


      # --------------------------------------------------
      # 7. Verify Frontend Image in ECR
      # --------------------------------------------------
      - name: Verify Frontend Image
        run: |
          echo "Verifying image in ECR..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "ECR image verified successfully."


      # --------------------------------------------------
      # 8. Start SSH Agent
      # --------------------------------------------------
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}


      # --------------------------------------------------
      # 9. Verify SSH Key
      # --------------------------------------------------
      - name: Check SSH Agent
        run: |
          ssh-add -l


      # --------------------------------------------------
      # 10. Deploy Through Bastion to Private EC2
      # --------------------------------------------------
      - name: Deploy Frontend Through Bastion
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |

          ssh -A \
            -o StrictHostKeyChecking=accept-new \
            "$BASTION_USER@${{ secrets.BASTION_HOST }}" \
            "ssh -A \
            -o StrictHostKeyChecking=accept-new \
            '$PRIVATE_EC2_USER@${{ secrets.FRONTEND_PRIVATE_EC2_HOST }}' \
            'bash -s'" <<REMOTE_EOF

          set -e

          echo "========================================"
          echo "Frontend Deployment Started"
          echo "========================================"

          echo "Frontend Host:"
          hostname

          echo "========================================"
          echo "Docker Version"
          echo "========================================"

          docker --version

          echo "========================================"
          echo "Logging into ECR"
          echo "========================================"

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

          echo "ECR Login Successful"

          echo "========================================"
          echo "Pulling Frontend Image"
          echo "========================================"

          docker pull \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Frontend Image Pulled Successfully"

          echo "========================================"
          echo "Stopping Old Frontend Container"
          echo "========================================"

          docker stop "$CONTAINER_NAME" || true

          echo "========================================"
          echo "Removing Old Frontend Container"
          echo "========================================"

          docker rm "$CONTAINER_NAME" || true

          echo "========================================"
          echo "Starting New Frontend Container"
          echo "========================================"

          docker run -d \
            --restart unless-stopped \
            --name "$CONTAINER_NAME" \
            -p "$CONTAINER_PORT:$CONTAINER_PORT" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Frontend container started"

          echo "========================================"
          echo "Waiting for Frontend"
          echo "========================================"

          sleep 15

          echo "========================================"
          echo "Checking Frontend Container"
          echo "========================================"

          docker ps \
            --filter "name=$CONTAINER_NAME"

          echo "========================================"
          echo "Frontend Container Logs"
          echo "========================================"

          docker logs --tail 30 "$CONTAINER_NAME" || true

          echo "========================================"
          echo "Frontend Deployment Completed"
          echo "========================================"

          REMOTE_EOF


      # --------------------------------------------------
      # 11. Deployment Successful
      # --------------------------------------------------
      - name: Frontend Deployment Successful
        if: success()
        run: |
          echo "========================================"
          echo "Frontend Deployment Successful"
          echo "========================================"
          echo "Repository: $ECR_REPOSITORY"
          echo "Image Tag: $IMAGE_TAG"


      # --------------------------------------------------
      # 12. Deployment Failed
      # --------------------------------------------------
      - name: Frontend Deployment Failed
        if: failure()
        run: |
          echo "========================================"
          echo "Frontend Deployment Failed"
          echo "========================================"
          echo "Check the GitHub Actions logs."


