name: Frontend - Build, Push to ECR & Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 937492564736.dkr.ecr.us-east-1.amazonaws.com/img1
  CONTAINER_NAME: frontend
  CONTAINER_PORT: 8501

jobs:

  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Configure AWS using OIDC
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================
      # 3. Login to Amazon ECR
      # ==========================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 4. Build Frontend Docker Image
      # ==========================================

      - name: Build Frontend Docker Image
        working-directory: frontend
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .


      # ==========================================
      # 5. Push Image to ECR
      # ==========================================

      - name: Push Frontend Image to ECR
        run: |
          docker push \
            $ECR_REPOSITORY:${{ github.sha }}


      # ==========================================
      # 6. Deploy Container to EC2
      # ==========================================

      - name: Deploy Frontend Container
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Logging into Amazon ECR"
            echo "================================="

            aws ecr get-login-password \
              --region us-east-1 \
              | docker login \
              --username AWS \
              --password-stdin \
              937492564736.dkr.ecr.us-east-1.amazonaws.com


            echo "================================="
            echo "Pulling Frontend Image"
            echo "================================="

            docker pull \
              937492564736.dkr.ecr.us-east-1.amazonaws.com/img1:${{ github.sha }}


            echo "================================="
            echo "Stopping Old Container"
            echo "================================="

            docker stop frontend || true

            docker rm frontend || true


            echo "================================="
            echo "Starting Frontend Container"
            echo "================================="

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 8501:8501 \
              -e API_URL="${{ secrets.BACKEND_URL }}" \
              937492564736.dkr.ecr.us-east-1.amazonaws.com/img1:${{ github.sha }}


            echo "================================="
            echo "Deployment Completed"
            echo "================================="


      # ==========================================
      # 7. Wait for Container
      # ==========================================

      - name: Wait for Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}

          script: |
            sleep 10


      # ==========================================
      # 8. Verify Container
      # ==========================================

      - name: Verify Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            echo "Running containers:"
            docker ps

            echo "Frontend logs:"
            docker logs frontend --tail 50

            echo "Checking frontend port:"
            curl -I http://localhost:8501





