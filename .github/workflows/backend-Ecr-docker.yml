name: Backend CI/CD - Docker ECR SSH

"on":
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "937492564736"

  ECR_REPOSITORY: backend

  BASTION_USER: ec2-user
  PRIVATE_EC2_USER: ec2-user

  CONTAINER_NAME: backend-container
  OLD_CONTAINER_NAME: backend-container-old

  CONTAINER_PORT: 8084

  # Unique image tag
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}

jobs:

  build-deploy-backend:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout Backend Source
        uses: actions/checkout@v4


      # ==================================================
      # 2. AWS CREDENTIALS
      # ==================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 3. VERIFY AWS
      # ==================================================

      - name: Verify AWS Identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity


      # ==================================================
      # 4. LOGIN TO ECR
      # ==================================================

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 5. BUILD IMAGE
      # ==================================================

      - name: Build Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

        run: |

          echo "========================================"
          echo "Building Backend Docker Image"
          echo "========================================"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

          echo "Image build completed."


      # ==================================================
      # 6. PUSH IMAGE TO ECR
      # ==================================================

      - name: Push Backend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

        run: |

          echo "========================================"
          echo "Pushing Backend Image"
          echo "========================================"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image pushed successfully."


      # ==================================================
      # 7. VERIFY ECR IMAGE
      # ==================================================

      - name: Verify Backend Image
        run: |

          echo "========================================"
          echo "Verifying ECR Image"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "ECR image verified."


      # ==================================================
      # 8. START SSH AGENT
      # ==================================================

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.1

        with:
          ssh-private-key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}


      # ==================================================
      # 9. VERIFY SSH KEY
      # ==================================================

      - name: Check SSH Agent
        run: |

          echo "Checking SSH agent..."

          ssh-add -l


      # ==================================================
      # 10. DEPLOY THROUGH BASTION
      # ==================================================

      - name: Deploy Backend Through Bastion

        env:

          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

          # Database configuration
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "========================================"
          echo "Connecting to Backend EC2"
          echo "========================================"

          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            -o ProxyCommand="ssh -W %h:%p \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              $BASTION_USER@${{ secrets.BASTION_HOST }}" \
            "$PRIVATE_EC2_USER@${{ secrets.BACKEND_PRIVATE_EC2_HOST }}" \
            'bash -s' <<REMOTE_EOF

          set -e

          echo "========================================"
          echo "BACKEND DEPLOYMENT STARTED"
          echo "========================================"

          echo "Hostname:"
          hostname

          echo "Private IP:"
          hostname -I

          echo "Docker version:"
          docker --version


          # ==================================================
          # ECR LOGIN
          # ==================================================

          echo "========================================"
          echo "Logging into ECR"
          echo "========================================"

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

          echo "ECR login successful."


          # ==================================================
          # PULL NEW IMAGE
          # ==================================================

          echo "========================================"
          echo "Pulling New Backend Image"
          echo "========================================"

          docker pull \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image pulled successfully."


          # ==================================================
          # REMOVE PREVIOUS ROLLBACK CONTAINER
          # ==================================================

          echo "========================================"
          echo "Preparing Rollback Container"
          echo "========================================"

          docker rm -f \
            "$OLD_CONTAINER_NAME" \
            2>/dev/null || true


          # ==================================================
          # SAVE CURRENT CONTAINER
          # ==================================================

          if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then

            echo "Existing backend container found."

            docker stop "$CONTAINER_NAME" || true

            docker rename \
              "$CONTAINER_NAME" \
              "$OLD_CONTAINER_NAME"

            echo "Previous container saved as:"
            echo "$OLD_CONTAINER_NAME"

          else

            echo "No existing backend container found."

          fi


          # ==================================================
          # CHECK PORT
          # ==================================================

          echo "========================================"
          echo "Checking Port $CONTAINER_PORT"
          echo "========================================"

          if ss -lntp | grep -q ":$CONTAINER_PORT "; then

            echo "ERROR: Port $CONTAINER_PORT is still occupied."

            ss -lntp | grep ":$CONTAINER_PORT " || true

            echo "Attempting rollback..."

            if docker inspect "$OLD_CONTAINER_NAME" >/dev/null 2>&1; then

              docker rename \
                "$OLD_CONTAINER_NAME" \
                "$CONTAINER_NAME"

              docker start "$CONTAINER_NAME"

            fi

            exit 1

          fi

          echo "Port $CONTAINER_PORT is available."


          # ==================================================
          # START NEW CONTAINER
          # ==================================================

          echo "========================================"
          echo "Starting New Backend Container"
          echo "========================================"

          docker run -d \
            --restart unless-stopped \
            --name "$CONTAINER_NAME" \
            -p "$CONTAINER_PORT:$CONTAINER_PORT" \
            -e DB_HOST="$DB_HOST" \
            -e DB_NAME="$DB_NAME" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "New container started."


          # ==================================================
          # WAIT FOR SPRING BOOT
          # ==================================================

          echo "========================================"
          echo "Waiting for Spring Boot"
          echo "========================================"

          sleep 30


          # ==================================================
          # CHECK CONTAINER STATUS
          # ==================================================

          echo "========================================"
          echo "Checking Container Status"
          echo "========================================"

          STATUS=\$(docker inspect \
            -f '{{.State.Status}}' \
            "$CONTAINER_NAME" \
            2>/dev/null || echo "missing")

          echo "Container status: \$STATUS"


          if [ "\$STATUS" != "running" ]; then

            echo "ERROR: Backend container is not running."

            echo "========================================"
            echo "Backend Logs"
            echo "========================================"

            docker logs \
              "$CONTAINER_NAME" \
              --tail 100 || true


            echo "========================================"
            echo "ROLLING BACK"
            echo "========================================"

            docker rm -f \
              "$CONTAINER_NAME" \
              2>/dev/null || true


            if docker inspect "$OLD_CONTAINER_NAME" >/dev/null 2>&1; then

              docker rename \
                "$OLD_CONTAINER_NAME" \
                "$CONTAINER_NAME"

              docker start "$CONTAINER_NAME"

              echo "Rollback successful."

            else

              echo "No previous container available."

            fi

            exit 1

          fi


          echo "Backend container is running."


          # ==================================================
          # SHOW CONTAINER
          # ==================================================

          echo "========================================"
          echo "Docker Status"
          echo "========================================"

          docker ps \
            --filter "name=$CONTAINER_NAME"


          # ==================================================
          # SHOW PORT
          # ==================================================

          echo "========================================"
          echo "Port Mapping"
          echo "========================================"

          docker port "$CONTAINER_NAME"


          # ==================================================
          # SHOW LOGS
          # ==================================================

          echo "========================================"
          echo "Backend Logs"
          echo "========================================"

          docker logs \
            --tail 50 \
            "$CONTAINER_NAME" || true


          # ==================================================
          # APPLICATION HEALTH CHECK
          # ==================================================

          echo "========================================"
          echo "Testing Backend Application"
          echo "========================================"

          if curl \
            --fail \
            --silent \
            --show-error \
            "http://localhost:$CONTAINER_PORT/" \
            >/dev/null; then

            echo "Backend application is responding."

          else

            echo "ERROR: Backend application is not responding."

            echo "========================================"
            echo "Backend Logs"
            echo "========================================"

            docker logs \
              --tail 100 \
              "$CONTAINER_NAME" || true


            echo "========================================"
            echo "ROLLING BACK"
            echo "========================================"

            docker rm -f \
              "$CONTAINER_NAME" \
              2>/dev/null || true


            if docker inspect "$OLD_CONTAINER_NAME" >/dev/null 2>&1; then

              docker rename \
                "$OLD_CONTAINER_NAME" \
                "$CONTAINER_NAME"

              docker start "$CONTAINER_NAME"

              echo "Rollback successful."

            else

              echo "No previous container available."

            fi

            exit 1

          fi


          # ==================================================
          # SUCCESS - REMOVE OLD CONTAINER
          # ==================================================

          echo "========================================"
          echo "New Backend Is Healthy"
          echo "========================================"

          docker rm -f \
            "$OLD_CONTAINER_NAME" \
            2>/dev/null || true

          echo "Old container removed."


          # ==================================================
          # CLEAN DANGLING IMAGES
          # ==================================================

          echo "========================================"
          echo "Cleaning Dangling Images"
          echo "========================================"

          docker image prune -f || true


          # ==================================================
          # FINAL
          # ==================================================

          echo "========================================"
          echo "BACKEND DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : $IMAGE_TAG"
          echo "Port       : $CONTAINER_PORT"

          REMOTE_EOF


      # ==================================================
      # 11. SUCCESS
      # ==================================================

      - name: Backend Deployment Successful
        if: success()

        run: |

          echo "========================================"
          echo "BACKEND DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo "Repository     : $ECR_REPOSITORY"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Container Port : $CONTAINER_PORT"


      # ==================================================
      # 12. FAILURE
      # ==================================================

      - name: Backend Deployment Failed
        if: failure()

        run: |

          echo "========================================"
          echo "BACKEND DEPLOYMENT FAILED"
          echo "========================================"

          echo "Check GitHub Actions logs."

