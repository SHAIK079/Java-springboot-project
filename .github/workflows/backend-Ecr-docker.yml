name: Backend CI/CD - Docker ECR SSH

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "937492564736"

  ECR_REPOSITORY: backend

  BASTION_USER: ec2-user
  PRIVATE_EC2_USER: ec2-user

  CONTAINER_NAME: backend-container
  CONTAINER_PORT: 8084

  IMAGE_TAG: ${{ github.sha }}

jobs:

  build-deploy-backend:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Backend Source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Verify AWS
      # --------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------
      # 4. Login to ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 5. Build Docker Image
      # --------------------------------------------------
      - name: Build Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend


      # --------------------------------------------------
      # 6. Push Image to ECR
      # --------------------------------------------------
      - name: Push Backend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # --------------------------------------------------
      # 7. Verify ECR Image
      # --------------------------------------------------
      - name: Verify Backend Image
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG


      # --------------------------------------------------
      # 8. Start SSH Agent
      # --------------------------------------------------
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}


      # --------------------------------------------------
      # 9. Add Bastion Host
      # --------------------------------------------------
      - name: Add Bastion to Known Hosts
        run: |
          mkdir -p ~/.ssh

          ssh-keyscan -H \
            ${{ secrets.BASTION_HOST }} \
            >> ~/.ssh/known_hosts


      # --------------------------------------------------
      # 10. Deploy Through Bastion
      # --------------------------------------------------
      - name: Deploy Backend Through Bastion
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |

          ssh -A \
            $BASTION_USER@${{ secrets.BASTION_HOST }} \
            "ssh -A $PRIVATE_EC2_USER@${{ secrets.BACKEND_PRIVATE_EC2_HOST }} << 'REMOTE_EOF'

              set -e

              echo '========================================'
              echo 'Backend Deployment Started'
              echo '========================================'

              echo 'Logging into ECR...'

              aws ecr get-login-password \
                --region $AWS_REGION \
                | docker login \
                --username AWS \
                --password-stdin $ECR_REGISTRY

              echo 'Pulling backend image...'

              docker pull \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

              echo 'Stopping old backend container...'

              docker stop $CONTAINER_NAME || true

              echo 'Removing old backend container...'

              docker rm $CONTAINER_NAME || true

              echo 'Starting new backend container...'

              docker run -d \
                --restart unless-stopped \
                --name $CONTAINER_NAME \
                -p $CONTAINER_PORT:$CONTAINER_PORT \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

              echo 'Waiting for backend...'

              sleep 20

              echo 'Checking backend container...'

              docker ps \
                --filter name=$CONTAINER_NAME

              echo '========================================'
              echo 'Backend Deployment Completed'
              echo '========================================'

          REMOTE_EOF"


      # --------------------------------------------------
      # 11. Success
      # --------------------------------------------------
      - name: Backend Deployment Successful
        if: success()
        run: |
          echo "Backend deployment successful."
          echo "Image: $ECR_REPOSITORY:$IMAGE_TAG"


      # --------------------------------------------------
      # 12. Failure
      # --------------------------------------------------
      - name: Backend Deployment Failed
        if: failure()
        run: |
          echo "Backend deployment failed."
          echo "Check GitHub Actions logs."

